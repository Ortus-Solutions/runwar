# This workflow builds Runwar with the CommandBox task runner (build.bx) and publishes the jar
# to the Ortus downloads bucket.

name: Runwar CI

# If your target is master or develop branch
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

  # We get the required keys
  workflow_call:
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_ACCESS_SECRET:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    # The task runner compiles with javac (bytecode target 11) and BoxLang needs Java 21+
    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        java-version: '21'
        distribution: 'temurin'

    # Install CommandBox from the Ortus bleeding-edge apt repo, which provides the `box` task runner CLI
    - name: Install CommandBox (bleeding edge)
      run: |
        curl -fsSl https://downloads.ortussolutions.com/debs/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/ortussolutions.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/ortussolutions.gpg] https://downloads.ortussolutions.com/debs-be/noarch /" | sudo tee /etc/apt/sources.list.d/commandbox.list
        sudo apt-get update
        sudo apt-get install -y apt-transport-https commandbox
        box version

    # Do the build
    - name: Build with the task runner
      run: |
        box task run build

    # The task lays the jar out at dist/release/<version>/runwar-<version>.jar, which is
    # exactly the bucket layout, so the upload is a straight sync of that folder
    - name: Upload JAR to S3
    
      # Run the upload on develop branch
      if: ${{ github.ref == 'refs/heads/develop' }}

      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read
      env:
        AWS_S3_BUCKET: "downloads.ortussolutions.com"
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
        SOURCE_DIR: "dist/release/"
        DEST_DIR: "cfmlprojects/runwar"
