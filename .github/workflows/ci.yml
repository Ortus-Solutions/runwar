# This workflow builds Runwar with the CommandBox task runner (build.bx) and publishes the jar
# to the Ortus downloads bucket.

name: Runwar CI

# If your target is master or develop branch
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

  # We get the required keys
  workflow_call:
    secrets:
      AWS_ACCESS_KEY:
        required: true
      AWS_ACCESS_SECRET:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    # The task runner compiles with javac (bytecode target 11) and BoxLang needs Java 21+
    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        java-version: '21'
        distribution: 'temurin'

    # Install BoxLang, then the bx-cli module which provides the `box` task runner CLI
    - name: Install BoxLang and bx-cli
      run: |
        /bin/sh -c "$(curl -fsSL https://install.boxlang.io)"
        boxlang --version
        install-bx-module bx-cli
        boxlang cli executable create box "boxlang cli"
        # module executables (including our `box`) live in the BoxLang home bin directory
        echo "$HOME/.boxlang/bin" >> $GITHUB_PATH

    # Do the build
    - name: Build with the task runner
      run: |
        export PATH="$HOME/.boxlang/bin:$PATH"
        box version
        box task run build

    # The task lays the jar out at dist/release/<version>/runwar-<version>.jar, which is
    # exactly the bucket layout, so the upload is a straight sync of that folder
    - name: Upload JAR to S3
    
      # Run the upload on master branch
      if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' }}

      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read
      env:
        AWS_S3_BUCKET: "downloads.ortussolutions.com"
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
        SOURCE_DIR: "dist/release/"
        DEST_DIR: "cfmlprojects/runwar"
